<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Page Splitter</title>
  <script src="lib/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>PDF Page Splitter ✂️📄</h1>
    <p>Select a PDF file and specify the starting and ending page numbers (inclusive) you wish to extract.</p>
    
    <label for="pdfInput">1. Upload PDF File:</label>
    <input type="file" id="pdfInput" accept=".pdf">
    
    <div class="input-group">
      <div>
        <label for="startPageInput">2. Start Page:</label>
        <input type="number" id="startPageInput" min="1" value="1">
      </div>
      <div>
        <label for="endPageInput">3. End Page:</label>
        <input type="number" id="endPageInput" min="1" value="1">
      </div>
    </div>
    
    <button onclick="processPdfFile()" id="processButton" disabled>Split and Download PDF</button>
    <div id="status"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
