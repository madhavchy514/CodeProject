<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Page Splitter</title>
  <script src="lib/pdf-lib.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: left;
    }
    h1 {
      color: #28a745;
      text-align: center;
    }
    label, input, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    input[type="file"], input[type="number"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    .input-group > div {
      flex: 1;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    button:hover:not(:disabled) {
      background-color: #1e7e34;
    }
    button:disabled {
      background-color: #90d39f;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PDF Page Splitter ✂️📄</h1>
    <p>Select a PDF file and specify the starting and ending page numbers (inclusive) you wish to extract.</p>
    
    <label for="pdfInput">1. Upload PDF File:</label>
    <input type="file" id="pdfInput" accept=".pdf">
    
    <div class="input-group">
      <div>
        <label for="startPageInput">2. Start Page:</label>
        <input type="number" id="startPageInput" min="1" value="1">
      </div>
      <div>
        <label for="endPageInput">3. End Page:</label>
        <input type="number" id="endPageInput" min="1" value="1">
      </div>
    </div>
    
    <button onclick="processPdfFile()" id="processButton" disabled>Split and Download PDF</button>
    <div id="status"></div>
  </div>
  
  <script>
    const { PDFDocument } = PDFLib; 
    
    const pdfInput = document.getElementById('pdfInput');
    const startPageInput = document.getElementById('startPageInput');
    const endPageInput = document.getElementById('endPageInput');
    const processButton = document.getElementById('processButton');
    const statusDiv = document.getElementById('status');
    let totalPages = 0;
    
    pdfInput.addEventListener('change', async () => {
      if (!pdfInput.files.length) {
        processButton.disabled = true;
        totalPages = 0;
        statusDiv.textContent = 'Please select a file.';
        return;
      }
      
      const file = pdfInput.files[0];
      statusDiv.textContent = `Analyzing ${file.name}...`;
      
      try {
        const pdfBytes = await file.arrayBuffer();
        const pdfDoc = await PDFDocument.load(pdfBytes, { ignoreEncryption: true });
        totalPages = pdfDoc.getPageCount();
        
        startPageInput.max = totalPages;
        endPageInput.max = totalPages;
        endPageInput.value = totalPages;                 
        statusDiv.textContent = `PDF Loaded: ${totalPages} pages total. Ready to split.`;
        processButton.disabled = false;
      } catch (e) {
        console.error(e);
        statusDiv.textContent = `❌ Error loading PDF: ${e.message}`;
        processButton.disabled = true;
        totalPages = 0;
      }
    });
    async function processPdfFile() {
      const file = pdfInput.files[0];
      const startPage = parseInt(startPageInput.value, 10);
      const endPage = parseInt(endPageInput.value, 10);
      if (!file) {
        statusDiv.textContent = 'Please select a PDF file first.';
        return;
      }
      if (startPage < 1 || endPage > totalPages || startPage > endPage) {
        statusDiv.textContent = 
        `❌ Invalid page range. Must be between 1 and ${totalPages}, and Start Page must be less than or equal to End Page.`;
        return;
      }
      statusDiv.textContent = `Splitting pages ${startPage} to ${endPage}...`;
      processButton.disabled = true;
      
      try {
        const existingPdfBytes = await file.arrayBuffer();
        
        const pdfBytes = await splitPdf(existingPdfBytes, startPage, endPage);
        
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        
        const originalFileName = file.name.replace(/\.pdf$/i, '');
        const outputFileName = `${originalFileName}_pages_${startPage}_${endPage}.pdf`;
        
        const a = document.createElement('a');
        a.href = url;
        a.download = outputFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        statusDiv.textContent = `✅ Done! Created new PDF with ${endPage - startPage + 1} pages. Download started.`;
        processButton.disabled = false;
        
      } catch (error) {
        console.error(error);
        statusDiv.textContent = `❌ An error occurred: ${error.message}`;
        processButton.disabled = false;
      }
    }
    async function splitPdf(existingPdfBytes, startPage, endPage) {
      const pdfDoc = await PDFDocument.load(existingPdfBytes);
      const newPdf = await PDFDocument.create();
      
      const pagesToCopy = [];
      for (let i = startPage - 1; i <= endPage - 1; i++) {
        pagesToCopy.push(i);
      }
      
      const copiedPages = await newPdf.copyPages(pdfDoc, pagesToCopy);
      
      copiedPages.forEach(page => newPdf.addPage(page));
      
      return newPdf.save();
    }
  </script>
</body>
</html>
