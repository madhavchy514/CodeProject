<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Drawing Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controller">
    <div class="linewidth">
      <span>Brush - <b id="b"></b></span>
      <input type="range" id="brushSize" min="1" max="100">
    </div>
    <div class="color">
      <span><b id="c"></b></span>
      <input type="color" id="colorPicker">
    </div>
    <div class="buttons">
      <button id="brush"><img src="img/brush.svg"></button>
      <button id="eraser"><img src="img/erase.svg"></button>
      <button id="clear"><img src="img/clear.svg"></button>
      <button id="undo"><img src="img/undo-left.svg"></button>
      <button id="redo"><img src="img/undo-left.svg" style="transform: rotateY(180deg);"></button>
      <button id="solidLine"><img src="img/line-tool.svg"></button>
      <button id="dashedLine"><img src="img/line-dashed.svg" style="transform: rotate(-10deg);"></button>
      <button id="arrowLine"><img src="img/arrow-narrow-right.svg"  style="transform: rotate(-45deg);"></button>
      <button id="download"><img src="img/download.svg"></button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
