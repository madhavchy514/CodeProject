<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Creator & Extractor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div id="creator">
      <span>Creator</span>
      <input type="text" spellcheck="false" id="url-input" placeholder="Enter the URL">
      <button id="create-btn">Generate</button>
      <div id="qr-output"></div>
      <button id="download-btn">Download</button>
    </div>
    <div id="extractor">
      <span>Extractor</span>
      <div id="drop-area">
        <span>Drop QR Code Image</span>
        <input type="file" id="qr-input" accept="image/*">
      </div>
      <div id="url-output"></div>
      <button id="copy-btn">Copy</button>
    </div>
  </div>
  <script src="lib/jsQR.min.js"></script>
  <script src="lib/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
