<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Conversion</title>
<style>
*{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  outline: none;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  background-color: #f4f7f6;
  color: #333;
}
h1 {
  font-size: 2.5em;
  margin-bottom: 1em;
  color: #2c3e50;
  text-align: center;
}
#input-container {
  background-color: #fff;
  padding: 2em;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
  margin-bottom: 2em;
  width: 90%;
  max-width: 500px;
}
input[type="file"] {
  margin-bottom: 1em;
  padding: 0.5em;
  border: 1px solid #ddd;
  border-radius: 4px;
  width: 100%;
}
select {
  padding: 0.5em;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin-bottom: 1em;
  width: 100%;
  cursor: pointer;
}
button {
  background-color: #1abc9c;
  color: #fff;
  padding: 0.75em 1.5em;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1em;
  transition: background-color 0.3s ease;
  width: 100%;
}
button:hover {
  background-color: #16a085;
}
#progress-bar {
  width: 90%;
  max-width: 500px;
  height: 1em;
  background-color: #e0e0e0;
  border-radius: 6px;
  margin-bottom: 1em;
  overflow: hidden;
  display: none;
}
#progress {
  height: 100%;
  width: 0%;
  background-color: #27ae60;
  transition: width 0.2s ease-out;
}
#progress-text {
  text-align: center;
  font-size: 0.9em;
  color: #777;
  margin-bottom: 1em;
  display: none;
}
#download-link {
  display: none;
  background-color: #3498db;
  color: #fff;
  padding: 0.75em 1.5em;
  border-radius: 6px;
  text-decoration: none;
  font-size: 1.1em;
  transition: background-color 0.3s ease;
}
#download-link:hover {
  background-color: #2980b9;
}
@media (max-width: 600px) {
  h1 {
    font-size: 2em;
  }
  #input-container {
    padding: 1.5em;
  }
  button {
    padding: 0.6em 1.2em;
    font-size: 0.9em;
  }
}
#drop-area {
  background-color: #fff;
  padding: 2em;
  border: 2px dashed #ccc;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
  margin-bottom: 20px;
  width: 100%;
  max-width: 500px;
  text-align: center;
  cursor: pointer;
}
#drop-area.dragover {
  border-color: #aaa;
  background-color: #f0f0f0;
}
#drop-area p {
  font-size: 1.1em;
  color: #555;
}
</style>
</head>
<body>
  <h1>Image Conversion & Zip-a-Rama!</h1>
  <div id="input-container">
    <div id="drop-area">
      <p>Drag & drop images here or click to select</p>
      <input type="file" id="image-input" multiple accept="image/*" style="display: none;">
    </div>
    <p style="text-align: center;margin-bottom: 10px; color: #999">Select the type you want as output</p>
    <select id="output-format">
      <option value="image/jpeg">JPEG</option>
      <option value="image/png">PNG</option>
      <option value="image/webp">WebP</option>
      <option value="image/gif">GIF</option>
      <option value="image/bmp">BMP</option>
    </select>
    <button id="convert-button">Convert & ZIP!</button>
  </div>
  <div id="progress-bar">
    <div id="progress"></div>
  </div>
  <div id="progress-text">0%</div>
  <a id="download-link" style="display: none;">Download Zip</a>
  <script src="lib/jszip.min.js"></script>
<script>
const imageInput = document.getElementById('image-input');
const convertButton = document.getElementById('convert-button');
const outputFormatSelect = document.getElementById('output-format');
const progressBar = document.getElementById('progress');
const progressText = document.getElementById('progress-text');
const downloadLink = document.getElementById('download-link');
const dropArea = document.getElementById('drop-area');
const realImageInput = document.getElementById('image-input');
dropArea.addEventListener('click', () => {
  realImageInput.click();
});
dropArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropArea.classList.add('dragover');
});
dropArea.addEventListener('dragleave', () => {
  dropArea.classList.remove('dragover');
});
dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  realImageInput.files = e.dataTransfer.files;
  updateDropAreaText();
  });
realImageInput.addEventListener('change', () => {
  updateDropAreaText();
  });
function updateDropAreaText() {
  if (realImageInput.files && realImageInput.files.length === 1) {
    dropArea.querySelector('p').textContent = realImageInput.files[0].name;
  } else if (realImageInput.files && realImageInput.files.length > 1) {
    dropArea.querySelector('p').textContent = `${realImageInput.files.length} files selected`;
  } else {
    dropArea.querySelector('p').textContent = 'Drag & drop images here or click to select';
  }
}
function updateProgress(processedCount, totalImages, fileName) {
  document.getElementById("progress-bar").style.display = 'block';
  const percentage = (processedCount / totalImages) * 100;
  progressBar.style.width = percentage + '%';
  progressText.innerHTML = `
    Converted <span style='color: #000; font-weight: bold'>${fileName}</span>
    (${processedCount}/${totalImages}) - 
    ${percentage.toFixed(2)}%
  `;
}
function readFileAsBlob(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      resolve(new Blob([reader.result], {
        type: file.type
      }));
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function convertBlob(blob, outputFormat) {
  return new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    canvas.toBlob((convertedBlob) => {
      if (convertedBlob) {
        resolve(convertedBlob);
      } else {
        reject(new Error('Failed to convert blob'));
      }
      URL.revokeObjectURL(img.src);
    }, outputFormat);
  };
  img.onerror = (error) => {
    URL.revokeObjectURL(img.src);
    reject(error);
  };
  const url = URL.createObjectURL(blob);
    img.src = url;
  });
}
async function processImages() {
  const files = Array.from(imageInput.files);
  const outputFormat = outputFormatSelect.value;
  const totalImages = files.length;
  let processedCount = 0;
  const zip = new JSZip();
  downloadLink.style.display = 'none';
  progressText.style.display = 'block';
  for (const file of files) {
    try {
      const blob = await readFileAsBlob(file);
      const convertedBlob = await convertBlob(blob, outputFormat);
      const fileExtension = outputFormat.split('/')[1];
      const fileName = `${file.name.split('.')[0]}_${Date.now()}.${fileExtension}`;
            const arrayBuffer = await convertedBlob.arrayBuffer();
      zip.file(fileName, arrayBuffer);
      processedCount++;
      updateProgress(processedCount, totalImages, file.name);
    } catch (error) {
      progressText.innerHTML = `<span style='color:red'>Error processing ${file.name}: ${error}</span>`;
    }
  }
  if (processedCount === 0) {
    progressText.innerHTML = "<span style='color:red'>No files were successfully converted.</span>";
    return;
  }
  progressText.innerHTML = ("Zipping...");
  const zipBlob = await zip.generateAsync({ type: "blob"});
  progressText.innerHTML = "Zipping completed!";
  await new Promise((res) => setTimeout(res, 1000));
  document.getElementById("progress-bar").style.display = 'none';
  const zipUrl = URL.createObjectURL(zipBlob);
  downloadLink.href = zipUrl;
  downloadLink.download = "converted_images.zip";
  downloadLink.style.display = "block";
  progressText.innerHTML = ("ALL DONE! Click the download link below!");
}
convertButton.addEventListener('click', processImages);
</script>
</body>
</html>
