<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio/Video to WAV Converter</title>
<style>

* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background-color: #f9f9f9;
  color: #333;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 30px;
  color: #2c3e50;
}

#dropArea {
  border: 2px dashed #3498db;
  padding: 40px;
  text-align: center;
  border-radius: 10px;
  background: #ecf5fc;
  color: #2980b9;
  font-size: 16px;
  max-width: 600px;
  margin: 0 auto 20px;
  cursor: pointer;
  transition: background-color 0.2s;
}

#dropArea.hover {
  background-color: #d0ebff;
}

#fileLabel {
  margin-top: 10px;
  font-weight: 500;
  color: #2c3e50;
}

button {
  display: block;
  margin: 0 auto 25px;
  padding: 10px 20px;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

button:hover {
  background-color: #2980b9;
}

#output {
  max-width: 800px;
  margin: 0 auto;
}

.file-block {
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  padding: 15px 20px;
  margin-bottom: 20px;
}

.file-block p {
  margin: 0 0 10px;
  font-weight: 500;
  color: #34495e;
}

.progress-container {
  height: 22px;
  width: 100%;
  background: #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2ecc71;
  text-align: center;
  color: #fff;
  line-height: 22px;
  font-size: 13px;
  transition: width 0.3s ease;
}

.download-link {
  display: inline-block;
  margin-top: 12px;
  background-color: #27ae60;
  color: white;
  padding: 6px 14px;
  border-radius: 4px;
  text-decoration: none;
  font-size: 14px;
  transition: background-color 0.2s ease;
}

.download-link:hover {
  background-color: #219150;
}

#zipSection {
  max-width: 800px;
  margin: 40px auto 0;
  text-align: center;
  display: none;
}

#zipSection button {
  background-color: #e67e22;
}

#zipSection button:hover {
  background-color: #d35400;
}

#zipMessage {
  margin-top: 10px;
  color: #7f8c8d;
  font-style: italic;
}

#fileInput {
  display: none;
}
</style>
</head>
<body>
  <h2>Multi Audio/Video to WAV Converter (No FFmpeg)</h2>
  <div id="dropArea">
    Drop files here or click to select
    <div id="fileLabel"></div>
  </div>
  <input type="file" id="fileInput" multiple accept="audio/*,video/*">
  <button onclick="handleFiles()">Convert Selected Files</button>
  <div id="output"></div>
  <div id="zipSection">
    <button onclick="downloadAllAsZip()">Download All as ZIP</button>
    <div id="zipMessage">Wait for zipping the WAVs...</div>
  </div>
  <script src="lib/jszip.min.js"></script>
<script>
  
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');
const fileLabel = document.getElementById('fileLabel');
const convertedFiles = [];

dropArea.addEventListener('click', () => fileInput.click());

dropArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropArea.classList.add('hover');
});

dropArea.addEventListener('dragleave', () => {
  dropArea.classList.remove('hover');
});

dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('hover');
  fileInput.files = e.dataTransfer.files;
  updateFileLabel();
});

fileInput.addEventListener('change', updateFileLabel);

function updateFileLabel() {
  const count = fileInput.files.length;
  if (count === 1) {
    fileLabel.textContent = fileInput.files[0].name;
  } else if (count > 1) {
    fileLabel.textContent = `${count} files selected`;
  } else {
    fileLabel.textContent = '';
  }
}

async function handleFiles() {
  const files = fileInput.files;
  const output = document.getElementById('output');
  const zipSection = document.getElementById('zipSection');
  convertedFiles.length = 0;
  zipSection.style.display = 'none';
  output.innerHTML = '';

  if (!files.length) {
    alert('Please select or drop files first.');
    return;
  }

  for (const file of files) {
    const fileBlock = document.createElement('div');
    fileBlock.className = 'file-block';

    const fileName = document.createElement('p');
    fileName.textContent = `Processing: ${file.name}`;
    fileBlock.appendChild(fileName);

    const progressContainer = document.createElement('div');
    progressContainer.className = 'progress-container';
    const progressBar = document.createElement('div');
    progressBar.className = 'progress-bar';
    progressBar.textContent = '0%';
    progressContainer.appendChild(progressBar);
    fileBlock.appendChild(progressContainer);

    const downloadLink = document.createElement('a');
    downloadLink.className = 'download-link';
    downloadLink.download = `${file.name.replace(/\.[^/.]+$/, "")}.wav`;
    downloadLink.textContent = 'Download WAV';
    fileBlock.appendChild(downloadLink);

    downloadLink.style.display = 'none';
    output.appendChild(fileBlock);

    await convertToWav(file, progressBar, downloadLink);
  }

  zipSection.style.display = 'block';
  document.getElementById('zipMessage').textContent = 'Click the button to create and download a ZIP file of all converted WAVs.';
}

async function convertToWav(file, progressBar, downloadLink) {
  updateProgress(progressBar, 0);

  let readProgress = 0;
  const arrayBuffer = await readFileWithProgress(file, progress => {
    readProgress = progress;
    updateProgress(progressBar, progress * 50);
  });

  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

  const wavData = await encodeWAV(audioBuffer, encodeProgress => {
    const totalProgress = 50 + encodeProgress * 50;
    updateProgress(progressBar, totalProgress);
  });

  const blob = new Blob([wavData], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);

  downloadLink.href = url;
  downloadLink.style.display = 'inline-block';

  updateProgress(progressBar, 100);

  convertedFiles.push({
    name: `${file.name.replace(/\.[^/.]+$/, "")}.wav`,
    blob: blob
  });
}

function updateProgress(bar, value) {
  bar.style.width = `${value}%`;
  bar.textContent = `${Math.floor(value)}%`;
}

async function encodeWAV(audioBuffer, onProgress = () => {}) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const bitsPerSample = 16;
  const format = 1;

  const samples = audioBuffer.length;
  const blockAlign = numChannels * bitsPerSample / 8;
  const byteRate = sampleRate * blockAlign;
  const dataSize = samples * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  let offset = 0;

  function writeString(s) {
    for (let i = 0; i < s.length; i++) {
      view.setUint8(offset++, s.charCodeAt(i));
    }
  }

  function writeUint16(val) {
    view.setUint16(offset, val, true);
    offset += 2;
  }

  function writeUint32(val) {
    view.setUint32(offset, val, true);
    offset += 4;
  }

  writeString('RIFF');
  writeUint32(36 + dataSize);
  writeString('WAVE');
  writeString('fmt ');
  writeUint32(16);
  writeUint16(format);
  writeUint16(numChannels);
  writeUint32(sampleRate);
  writeUint32(byteRate);
  writeUint16(blockAlign);
  writeUint16(bitsPerSample);
  writeString('data');
  writeUint32(dataSize);

  const chunkSize = 8192;
  let i = 0;

  async function processChunk() {
    const end = Math.min(i + chunkSize, samples);
    for (; i < end; i++) {
      for (let ch = 0; ch < numChannels; ch++) {
        const sample = audioBuffer.getChannelData(ch)[i];
        const s = Math.max(-1, Math.min(1, sample));
        view.setInt16(offset, s * 0x7FFF, true);
        offset += 2;
      }
    }
    onProgress(i / samples);
    if (i < samples) {
      await new Promise(requestAnimationFrame);
      return processChunk();
    }
  }

  await processChunk();
  onProgress(1);
  return buffer;
}


async function downloadAllAsZip() {
  const zip = new JSZip();
  const msg = document.getElementById('zipMessage');
  msg.textContent = 'Zipping files, please wait...';

  for (const file of convertedFiles) {
    zip.file(file.name, file.blob);
  }

  const content = await zip.generateAsync({ type: "blob" });

  const link = document.createElement('a');
  link.href = URL.createObjectURL(content);
  link.download = "converted_wavs.zip";
  link.click();

  msg.textContent = 'ZIP file downloaded!';
}

function readFileWithProgress(file, onProgress = () => {}) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onloadstart = () => onProgress(0);
    reader.onprogress = e => {
      if (e.lengthComputable) {
        onProgress(e.loaded / e.total);
      }
    };
    reader.onload = () => {
      onProgress(1);
      resolve(reader.result);
    };
    reader.onerror = reject;

    reader.readAsArrayBuffer(file);
  });
}
</script>
</body>
</html>
