<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to PNG Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <h1>PDF to PNG Converter</h1>
        <div id="uploadBox" class="upload-area">Click or Drag PDF here to upload</div>
        <input type="file" id="fileInput" accept="application/pdf" />
        <div class="options-container">
            <label for="scale">Rendering Quality:</label>
            <select id="scale">
                <option value="1">Low</option>
                <option value="1.5">Medium</option>
                <option value="2" selected>High</option>
                <option value="3">Very High</option>
            </select>
        </div>
        <button id="extractButton" disabled>Extract Images</button>
        <div id="fileInfo"></div>
        <div id="progressbar-container">
            <div id="progressbar"></div>
            <div id="progressbar-label">0%</div>
        </div>
        <div id="progressInfo"></div>
        <div id="imageContainer"></div>
        <div id="loadingIndicator">
            <div class="spinner"></div>&nbsp;&nbsp;&nbsp;<span>Creating ZIP file...</span>
        </div>
    </div>
    <script src="lib/pdf.min.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
