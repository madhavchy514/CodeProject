<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to PDF</title>
<style>
*{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  outline: none;
}
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(145deg, #f5f7fa, #e4e7ec);
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  justify-content: center;
  color: #333;
}
.container {
  background: white;
  padding: 30px 40px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  text-align: center;
  width: 90%;
  max-width: 500px;
  transition: 0.3s ease;
}
.container:hover {
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
}
h1 {
  margin-bottom: 20px;
  font-size: 22px;
  font-weight: 600;
  color: #222;
}
input[type="file"] {
  padding: 10px;
  background: #f9f9f9;
  border: 1px solid #ddd;
  border-radius: 8px;
  width: 100%;
  cursor: pointer;
  margin-bottom: 20px;
}
button {
  background-color: #007bff;
  color: white;
  border: none;
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s ease;
  width: 100%;
}
button:hover {
  background-color: #0056b3;
}
#progress-container {
  margin-top: 20px;
  width: 100%;
  height: 14px;
  background: #e0e0e0;
  border-radius: 8px;
  overflow: hidden;
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(to right, #28a745, #6ddf6c);
  transition: width 0.3s ease;
}
#status {
  margin-top: 12px;
  font-size: 14px;
  color: #666;
}
</style>
</head>
<body>
  <div class='container'><h1>Image to PDF (Fixed Height Pages)</h1>
  <input type="file" id="imageInput" multiple accept="image/*">
  <br>
  <button onclick="generatePDF()">Create PDF</button>
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>
  <div id="status">Waiting for images...</div></div>
  <script src="lib/jspdf.umd.min.js"></script>
<script>
const pxToMm = px => px * 0.264583;
const { jsPDF } = window.jspdf;
async function generatePDF() {
  const files = document.getElementById('imageInput').files;
  const progressBar = document.getElementById('progress-bar');
  const status = document.getElementById('status');
  if (!files.length) {
    alert("Please select image files first.");
    return;
  }
  const fixedPageHeight = 297;
  const maxPageWidth = 210;
  const minPageWidth = 100;
  let pdf;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const dataURL = await readFileAsDataURL(file);
    const img = await loadImage(dataURL);
    const imgHeightMm = pxToMm(img.height);
    const imgWidthMm = pxToMm(img.width);
    const scale = fixedPageHeight / imgHeightMm;
    let scaledWidth = imgWidthMm * scale;
    let scaledHeight = fixedPageHeight;
    if (scaledWidth > maxPageWidth) {
      scaledWidth = maxPageWidth;
      scaledHeight = imgHeightMm * (maxPageWidth / imgWidthMm);
    }
    if (scaledWidth < minPageWidth) {
      scaledWidth = minPageWidth;
      scaledHeight = imgHeightMm * (minPageWidth / imgWidthMm);
    }
    if (i === 0) {
      pdf = new jsPDF({
        orientation: scaledWidth > scaledHeight ? 'l' : 'p',
        unit: 'mm',
        format: [scaledWidth, scaledHeight]
      });
    } else {
      pdf.addPage([scaledWidth, scaledHeight], scaledWidth > scaledHeight ? 'l' : 'p');
    }
    pdf.addImage(dataURL, 'JPEG', 0, 0, scaledWidth, scaledHeight);
    const percent = ((i + 1) / files.length) * 100;
    progressBar.style.width = `${percent}%`;
    status.textContent = `Processed ${i + 1} of ${files.length}`;
  }
  pdf.save("images_fixed_height.pdf");
  status.textContent = "PDF created successfully!";
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
</script>
</body>
</html>
