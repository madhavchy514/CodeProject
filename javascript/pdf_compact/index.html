<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Page Combiner & Rotator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>PDF Page Combiner & Rotator 🔄📄</h1>
    <p>
      Select a PDF file. Pages will be combined into new pages, 
      two originals per new page, rotated 90 degrees, stacked top-to-bottom.
    </p>
    <input type="file" id="pdfInput" accept=".pdf">
    <button onclick="processPdfFile()" id="processButton" disabled>Process PDF</button>
    <div id="status"></div>
  </div>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
